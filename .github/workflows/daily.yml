name: Daily Forecast Update

on:
  schedule:
    # GitHub 的 schedule 有约 4.5 小时延迟（实测 00:30 UTC 设定 -> 04:56~05:16 UTC 执行）
    # 因此设为 UTC 20:00 = 北京 04:00，加延迟后约在北京 08:30 完成
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      # ---- 从 data-cache 分支取历史 chunks ----
      - name: Fetch chunks cache
        run: |
          mkdir -p chunks
          if git ls-remote --exit-code --heads origin data-cache >/dev/null 2>&1; then
            git fetch origin data-cache --depth=1
            git show origin/data-cache:chunks.tar.gz > chunks.tar.gz 2>/dev/null || true
          fi
          if [ -s chunks.tar.gz ]; then
            python3 pack_chunks.py unpack
          else
            echo "::warning::no cache found, starting fresh"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ---- 增量抓取 ----
      - name: Incremental fetch
        run: python3 daily_update.py

      # ---- 重建 CSV ----
      - name: Build pipelines
        run: |
          python3 build_final.py
          python3 build_province.py
          python3 rename_single.py
          python3 rebuild_all.py

      # ---- 核验（失败则中止）----
      - name: Verify
        run: python3 verify_data.py csv_out

      - name: Regenerate README
        run: python3 gen_readme.py

      # ---- 发布 CSV ----
      - name: Publish CSVs
        run: |
          mkdir -p data
          for f in csv_out/*.csv; do
            b=$(basename "$f")
            case "$b" in
              鲁中参考点.csv) continue ;;   # 内部排查产物，不对外
            esac
            cp "$f" data/
          done
          ls -la data/ | head -25

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ README.md verify_data.py
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "Daily update $(date -u '+%Y-%m-%d')"
            git push origin HEAD:main
          fi

      # ---- 更新 chunks 缓存分支 ----
      - name: Repack and push cache
        run: |
          python3 pack_chunks.py pack
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan data-cache-new
          git rm -rf --cached . >/dev/null 2>&1 || true
          cp chunks.tar.gz /tmp/cache.tar.gz
          rm -rf chunks csv_out data .github *.py README*.md
          cp /tmp/cache.tar.gz chunks.tar.gz
          git add -f chunks.tar.gz
          git commit -m "cache $(date -u '+%Y-%m-%d')"
          git push -f origin HEAD:data-cache
